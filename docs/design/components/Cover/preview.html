<style>
html,body{margin:0;height:100%}
body{background:var(--ground);position:relative;overflow:hidden}
svg{position:absolute;left:480px;top:0}
.proof{fill:var(--proof)}.ink{fill:var(--ink)}.gate{fill:var(--gate)}.halt{fill:var(--halt)}.wash{fill:var(--proof-wash)}
.tile{fill:var(--on-ink);rx:var(--radius-sm)}
.you{fill:var(--gate)}
.t{position:absolute;left:32px;bottom:32px;width:440px}
.n{font-family:var(--font-display);font-weight:800;font-size:80px;line-height:.95;color:var(--ink)}
.g{margin-top:12px;font-family:var(--font-sans);font-size:14px;line-height:20px;color:var(--ink-muted)}

<body>
<svg width="480" height="288" viewBox="0 0 480 288" aria-hidden="true">
<!--
 blocks: proof 240x192, ink 192x288, gate 144x96, proof-wash 96x96, halt 48x48, all multiples of space-7 (48px)
 arrangement: tall ink slab bleeding top, right and bottom, proof bleeding top, gate and tint stacked under it
 pattern: literal motif. A grid of square agent punches holding one round brass person, because "humans are round, agents are square" is this system's reserved shape rule
 scales: pitch space-7, tile 32px (space-6), tile corners radius-sm, disc radius-full
-->
<rect class="proof" x="48" y="0" width="240" height="192"/>
<rect class="ink" x="288" y="0" width="192" height="288"/>
<rect class="wash" x="48" y="192" width="96" height="96"/>
<rect class="halt" x="96" y="240" width="48" height="48"/>
<rect class="gate" x="144" y="192" width="144" height="96"/>
<rect class="tile" x="312" y="24" width="32" height="32"/>
<rect class="tile" x="360" y="24" width="32" height="32"/>
<rect class="tile" x="408" y="24" width="32" height="32"/>

<rect class="tile" x="360" y="72" width="32" height="32"/>

<rect class="tile" x="312" y="120" width="32" height="32"/>
<rect class="tile" x="360" y="120" width="32" height="32"/>
<rect class="tile" x="408" y="120" width="32" height="32"/>
<rect class="tile" x="312" y="168" width="32" height="32"/>
<circle class="you" cx="376" cy="184" r="16"/>
<rect class="tile" x="408" y="168" width="32" height="32"/>
<rect class="tile" x="312" y="216" width="32" height="32"/>
<rect class="tile" x="360" y="216" width="32" height="32"/>
<rect class="tile" x="408" y="216" width="32" height="32"/>
</svg>
<div class="t"><div class="n">Ingenious<br>Clan</div><div class="g">Every action attributed, proven and under your authority.</div></div>

</html>
