[package]
name = "ingenious-forge-server"
version = "0.1.0"
edition = "2021"
description = "Forge local HTTP server"
license = "Apache-2.0"

[[bin]]
name = "forge-server"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
